<svg xmlns="http://www.w3.org/2000/svg" width="880" height="130" viewBox="0 0 880 130" role="img" aria-label="llm-assessment-pipeline at a glance: 2 providers in sequence, Zod validation before persistence, exactly 1 correct option of 4 required, 30,000 millisecond timeout before the fallback runs">
  <rect width="880" height="130" rx="10" fill="#0d1117" stroke="#30363d"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="20" y="17" width="195" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="36" y="43" fill="#7d8590" font-size="11" letter-spacing="1">PROVIDERS</text>
    <text x="36" y="69" fill="#58a6ff" font-size="16" font-weight="600">2, sequential</text>
    <text x="36" y="93" fill="#7d8590" font-size="12">OpenAI then Gemini</text>
    <rect x="235" y="17" width="195" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="251" y="43" fill="#7d8590" font-size="11" letter-spacing="1">VALIDATION</text>
    <text x="251" y="69" fill="#f85149" font-size="16" font-weight="600">Zod, pre-store</text>
    <text x="251" y="93" fill="#7d8590" font-size="12">malformed JSON throws</text>
    <rect x="450" y="17" width="195" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="466" y="43" fill="#7d8590" font-size="11" letter-spacing="1">ANSWER RULE</text>
    <text x="466" y="69" fill="#d29922" font-size="16" font-weight="600">exactly 1 of 4</text>
    <text x="466" y="93" fill="#7d8590" font-size="12">zero or many rejected</text>
    <rect x="665" y="17" width="195" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="681" y="43" fill="#7d8590" font-size="11" letter-spacing="1">TIMEOUT</text>
    <text x="681" y="69" fill="#3fb950" font-size="16" font-weight="600">30,000 ms</text>
    <text x="681" y="93" fill="#7d8590" font-size="12">then Gemini takes over</text>
  </g>
</svg>
