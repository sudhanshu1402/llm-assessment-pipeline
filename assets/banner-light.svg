<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-label="llm-assessment-pipeline: schema-checked model output with provider failover. reference implementation, mock queue. The failure it exists for: almost-valid JSON poisons the store. Zod parses it before it counts as done.">
  <title>llm-assessment-pipeline</title>
  <style>
    .m { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    .n { font-size: 34px; font-weight: 700; fill: #1b7c83; }
    .t { font-size: 15px; fill: #656d76; }
    .s { font-size: 12px; fill: #656d76; }
    .l { font-size: 11px; fill: #656d76; letter-spacing: 2.5px; }
    .f { font-size: 13px; fill: #1f2328; }
    .ul { fill: #1b7c83; transform-origin: 56px 0; animation: ul .7s cubic-bezier(.2,.8,.2,1) .15s both; }
    @keyframes ul { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    @media (prefers-reduced-motion: reduce) {
      .ul { animation: none }
    }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#eaeef2" />
    </pattern>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="179" rx="14" fill="#ffffff" stroke="#d0d7de" />
  <rect x="1" y="1" width="1198" height="178" rx="14" fill="url(#dots)" />
  <text class="m n" x="56" y="72">llm-assessment-pipeline</text>
  <rect class="ul" x="56" y="86" width="430" height="3" rx="1.5" />
  <text class="m t" x="56" y="118">schema-checked model output with provider failover</text>
  <text class="m s" x="56" y="148">reference implementation  .  mock queue</text>
  <g>
    <rect x="700.5" y="36.5" width="443" height="107" rx="8" fill="none" stroke="#d0d7de" />
    <text class="m l" x="724" y="64">THE FAILURE IT EXISTS FOR</text>
    <text class="m f" x="724" y="94">almost-valid JSON poisons the store.</text>
    <text class="m f" x="724" y="116">Zod parses it before it counts as done.</text>
  </g>
</svg>
