<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="llm-assessment-pipeline as a git graph: a job goes to GPT-4o-mini, which fails; a fallback branch re-runs the same chain on Gemini 1.5 Flash; Zod checks 4 options with exactly one correct; then it is stored. Two or zero correct options are rejected at the gate." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.mo{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}.sa{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}.se{font-family:Georgia,"Times New Roman",serif}.bl{font-family:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif}
.in{}@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.dr{}@keyframes dr{to{stroke-dashoffset:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style>
<rect width="1200" height="500" fill="#fffdf7"/>
<text x="56" y="78" class="sa" font-size="40" font-weight="700" fill="#111">llm-assessment-pipeline</text>
<text x="56" y="106" class="mo" font-size="15" fill="#777">git log --graph, of one generated question</text>
<g fill="none" stroke-width="6" stroke-linecap="round"><path class="dr" d="M80 160V450" stroke="#6f42c1"/><path class="dr" d="M80 230C80 262 160 262 160 290V330C160 360 80 360 80 380" stroke="#e36209" style="animation-delay:0.8s"/></g>
<g class="mo" font-size="16">
<g class="in" style="animation-delay:0.2s"><circle cx="80" cy="160" r="11" fill="#fffdf7" stroke="#6f42c1" stroke-width="5"/><text x="210" y="166" fill="#b08800">job</text><text x="330" y="166" fill="#111">topic, difficulty, language</text></g>
<g class="in" style="animation-delay:0.5s"><circle cx="80" cy="230" r="11" fill="#d73a49"/><text x="210" y="236" fill="#b08800">primary</text><text x="330" y="236" fill="#d73a49">GPT-4o-mini  ✕ error or invalid output</text></g>
<g class="in" style="animation-delay:1.1s"><circle cx="160" cy="310" r="11" fill="#fffdf7" stroke="#e36209" stroke-width="5"/><text x="210" y="316" fill="#b08800">fallback</text><text x="330" y="316" fill="#111">same chain, re-run on Gemini 1.5 Flash</text></g>
<g class="in" style="animation-delay:1.6s"><circle cx="80" cy="380" r="11" fill="#fffdf7" stroke="#6f42c1" stroke-width="5"/><text x="210" y="386" fill="#b08800">zod</text><text x="330" y="386" fill="#111">4 options, exactly 1 isCorrect  <tspan fill="#28a745">✓</tspan></text></g>
<g class="in" style="animation-delay:2s"><circle cx="80" cy="450" r="11" fill="#6f42c1"/><text x="210" y="456" fill="#b08800">HEAD</text><text x="330" y="456" fill="#111" font-weight="700">stored. almost-valid JSON never gets here.</text></g></g>
<g class="in mo" font-size="14" style="animation-delay:2.3s"><rect x="880" y="150" width="270" height="120" rx="10" fill="#f3efe0"/><text x="900" y="182" fill="#555">rejected at the gate</text>
<text x="900" y="212" fill="#d73a49">✕ 2 correct options</text><text x="900" y="240" fill="#d73a49">✕ 0 correct options</text></g>
<text x="1150" y="456" text-anchor="end" class="mo" font-size="12" fill="#999">reference implementation · mock queue</text></svg>